ShortDescription: Tiny Windows tray weather app with rain, air quality and US severe weather alerts.
Description: Zephyr draws the current temperature in the system tray icon and shows today and tomorrow on hover. It notifies you when rain starts within the next hour, when the air quality is unhealthy, and when the US National Weather Service has a severe warning for your city. About 2 MB, around 20 MB of RAM, no installer and no account.
