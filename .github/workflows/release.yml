name: release

# Publishing a GitHub release builds the EXE from that tag and attaches it,
# with its checksum, to the same release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release

      - name: Name the EXE and checksum it
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          asset="HoverSky-v${version}-windows-x64.exe"
          cp target/release/hoversky.exe "$asset"
          sha256sum "$asset" > "$asset.sha256"
          cat "$asset.sha256"

      # Signing placeholder: add a SignPath step here (https://signpath.org)
      # before the upload, signing HoverSky-v*-windows-x64.exe, so SmartScreen
      # stops warning about an unknown publisher.

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" HoverSky-v*-windows-x64.exe HoverSky-v*-windows-x64.exe.sha256 --clobber
